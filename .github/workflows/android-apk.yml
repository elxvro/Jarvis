name: Build ELXVRO MIA APK
# v0.1.1 Turkish voice response build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android 36 SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Generate built-in Turkish voice files (eSpeak NG)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak-ng
          bash scripts/generate_voice_assets.sh
      - name: Include verified Turkish Vosk model in APK
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/models
          MODEL="app/src/main/assets/models/vosk-model-small-tr-0.3.zip"
          curl --fail --location --retry 3 --retry-delay 4 --connect-timeout 30 --max-time 240 \
            "https://alphacephei.com/vosk/models/vosk-model-small-tr-0.3.zip" \
            -o "$MODEL"
          echo "8c8d07cec1bce31add14967c16891c84152cdf76d391e33c08278119b9ea96e5  $MODEL" | sha256sum --check
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          p = Path("app/src/main/assets/models/vosk-model-small-tr-0.3.zip")
          with ZipFile(p) as z:
              names = set(z.namelist())
              prefix = "vosk-model-small-tr-0.3/"
              old = {prefix + p for p in ("final.mdl", "mfcc.conf", "HCLr.fst", "Gr.fst")}
              modern = {prefix + p for p in ("am/final.mdl", "conf/model.conf")}
              assert old.issubset(names) or modern.issubset(names), "Unexpected Vosk layout: " + str(list(sorted(names))[:12])
              assert z.testzip() is None, "Corrupt Vosk ZIP"
              print("Vosk model verified:", "legacy" if old.issubset(names) else "modern", len(names), "entries")
          PY
      - name: Prepare official on-device llama.cpp inference engine
        run: |
          set -euo pipefail
          mkdir -p .native
          git clone --depth 1 --branch v0.6.0 --filter=blob:none             https://github.com/ggml-org/llama.cpp.git .native/llama.cpp
          mkdir -p gradle
          cp .native/llama.cpp/examples/llama.android/gradle/libs.versions.toml gradle/libs.versions.toml
          sed -i 's/agp = "8.13.2"/agp = "8.11.1"/' gradle/libs.versions.toml
          sed -i 's/kotlin = "2.3.0"/kotlin = "2.2.20"/' gradle/libs.versions.toml
          LIB=.native/llama.cpp/examples/llama.android/lib/build.gradle.kts
          sed -i 's/"29.0.13113456"/"28.2.13676358"/' "$LIB"
          sed -i 's/listOf("arm64-v8a", "x86_64")/listOf("arm64-v8a")/' "$LIB"
          sed -i 's/-DGGML_CPU_ALL_VARIANTS=ON/-DGGML_CPU_ALL_VARIANTS=OFF/' "$LIB"
          sed -i 's/-DGGML_BACKEND_DL=ON/-DGGML_BACKEND_DL=OFF/' "$LIB"
          sed -i 's/-DGGML_OPENMP=ON/-DGGML_OPENMP=OFF/' "$LIB"
          sed -i '/arguments += "-DGGML_LLAMAFILE=OFF"/a\                arguments += "-DGGML_CPU_KLEIDIAI=OFF"\n                arguments += "-DGGML_OPENMP=OFF"' "$LIB"
          sdkmanager --install "ndk;28.2.13676358" "cmake;3.31.6"
      - name: Test and build
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ELXVRO-MIA-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
